<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="240" fill="#FFFFFF" rx="8"/>

  <!-- Top Title -->
  <text x="30" y="24" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#001A3F">GraPARI Evolution: From Transaction Factory to NextGen Experience Hub</text>

  <!-- Left Box: AS-IS Layout -->
  <g transform="translate(30, 40)">
    <rect width="400" height="180" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.2" filter="url(#shadow3)"/>
    <rect width="400" height="30" rx="6" fill="#E4002B"/>
    <text x="200" y="20" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AS-IS: Routine Administrative Facility (±350 Outlets)</text>

    <!-- Floor allocation -->
    <rect x="20" y="45" width="220" height="85" fill="#FFE5E5" stroke="#E4002B" stroke-width="0.8" rx="4"/>
    <text x="130" y="80" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#C53030" text-anchor="middle">75% Floor Space</text>
    <text x="130" y="96" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">10–15 Manual CS Desks</text>
    <text x="130" y="110" font-family="'Times New Roman', serif" font-size="8" fill="#777777" text-anchor="middle">SIM swaps, billing slips, forms</text>

    <rect x="250" y="45" width="130" height="85" fill="#EEEEEE" stroke="#999999" stroke-width="0.8" rx="4"/>
    <text x="315" y="80" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">25% Waiting</text>
    <text x="315" y="96" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">Congested Lobby</text>
    <text x="315" y="110" font-family="'Times New Roman', serif" font-size="8" fill="#777777" text-anchor="middle">Paper ticket queue</text>

    <!-- Key metric -->
    <text x="20" y="152" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#C53030">• High Facility OpEx: ~Rp1.07B per outlet/year</text>
    <text x="20" y="167" font-family="'Times New Roman', serif" font-size="9" fill="#555555">• High carbon footprint: 2.0–3.0 kg CO2e / interaction</text>
  </g>

  <!-- Right Box: TO-BE Layout -->
  <g transform="translate(470, 40)">
    <rect width="400" height="180" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.2" filter="url(#shadow3)"/>
    <rect width="400" height="30" rx="6" fill="#002B66"/>
    <text x="200" y="20" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TO-BE: NextGen Experience &amp; Community Hub</text>

    <!-- Floor allocation -->
    <rect x="20" y="45" width="100" height="85" fill="#EBF8FF" stroke="#002B66" stroke-width="0.8" rx="4"/>
    <text x="70" y="75" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">24/7 Kiosks</text>
    <text x="70" y="90" font-family="'Times New Roman', serif" font-size="8" fill="#555555" text-anchor="middle">Exterior Facade</text>
    <text x="70" y="104" font-family="'Times New Roman', serif" font-size="7.5" fill="#002B66" text-anchor="middle">Instant SIM Dispenser</text>

    <rect x="130" y="45" width="140" height="85" fill="#F0FFF4" stroke="#28A745" stroke-width="0.8" rx="4"/>
    <text x="200" y="75" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#1E7E34" text-anchor="middle">50% MSME Hub</text>
    <text x="200" y="90" font-family="'Times New Roman', serif" font-size="8" fill="#555555" text-anchor="middle">5G / IoT Living Demo</text>
    <text x="200" y="104" font-family="'Times New Roman', serif" font-size="7.5" fill="#1E7E34" text-anchor="middle">Local SME Workshops</text>

    <rect x="280" y="45" width="100" height="85" fill="#FFF9F2" stroke="#D97706" stroke-width="0.8" rx="4"/>
    <text x="330" y="75" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#B45309" text-anchor="middle">30% High Touch</text>
    <text x="330" y="90" font-family="'Times New Roman', serif" font-size="8" fill="#555555" text-anchor="middle">Consultation Pods</text>
    <text x="330" y="104" font-family="'Times New Roman', serif" font-size="7.5" fill="#B45309" text-anchor="middle">Complex cases/Seniors</text>

    <!-- Key metric -->
    <text x="20" y="152" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#1E7E34">• OpEx savings: Rp172.5B/yr across branch network</text>
    <text x="20" y="167" font-family="'Times New Roman', serif" font-size="9" fill="#555555">• Converts branch into high-margin B2B/FMC revenue driver</text>
  </g>
</svg>
