<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B66"/>
      <stop offset="100%" stop-color="#001A3F"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="320" fill="#FFFFFF" rx="8"/>

  <!-- Layer 1: Consumer Touchpoints -->
  <g transform="translate(20, 20)">
    <rect width="180" height="280" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="36" rx="6" fill="url(#headerGrad)"/>
    <text x="90" y="23" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Touchpoints Layer</text>
    
    <!-- Channels -->
    <rect x="15" y="50" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="90" y="70" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#002B66" text-anchor="middle">MyTelkomsel App</text>
    <text x="90" y="86" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">50M MAU | Eco-Pass UI</text>

    <rect x="15" y="108" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#25D366" stroke-width="1.2"/>
    <text x="90" y="128" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#128C7E" text-anchor="middle">WhatsApp Business API</text>
    <text x="90" y="144" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">Zero-Download Vernacular</text>

    <rect x="15" y="166" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/>
    <text x="90" y="186" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#E4002B" text-anchor="middle">Vernacular Voice AI</text>
    <text x="90" y="202" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">Bahasa, Javanese, Sundanese</text>

    <rect x="15" y="224" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="90" y="244" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#002B66" text-anchor="middle">24/7 Smart Kiosks</text>
    <text x="90" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">Exterior GraPARI Pods</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 205 160 L 235 160" stroke="#E4002B" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Layer 2: Agentic AI & Intelligence Core -->
  <g transform="translate(240, 20)">
    <rect width="250" height="280" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="36" rx="6" fill="url(#headerGrad)"/>
    <text x="125" y="23" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Agentic AI & Intelligence Core</text>

    <rect x="15" y="50" width="220" height="60" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="125" y="72" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#002B66" text-anchor="middle">Veronika Agentic Orchestrator</text>
    <text x="125" y="88" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">Microsoft Azure OpenAI Service</text>
    <text x="125" y="100" font-family="'Times New Roman', serif" font-size="8.5" fill="#E4002B" text-anchor="middle">Intent Routing | Action Planning</text>

    <rect x="15" y="120" width="220" height="68" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="125" y="140" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#002B66" text-anchor="middle">Autonomous Micro-Agents</text>
    <text x="125" y="156" font-family="'Times New Roman', serif" font-size="9" fill="#333333" text-anchor="middle">• SIM/eSIM Lifecycle Agent</text>
    <text x="125" y="170" font-family="'Times New Roman', serif" font-size="9" fill="#333333" text-anchor="middle">• Bill & Roaming Recommender</text>
    <text x="125" y="182" font-family="'Times New Roman', serif" font-size="9" fill="#333333" text-anchor="middle">• CyberGuard Fraud Detector</text>

    <rect x="15" y="198" width="220" height="72" rx="4" fill="#F0FFF4" stroke="#28A745" stroke-width="1.2"/>
    <text x="125" y="218" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#1E7E34" text-anchor="middle">Eco-Pass Carbon Engine</text>
    <text x="125" y="234" font-family="'Times New Roman', serif" font-size="9" fill="#555555" text-anchor="middle">GHG Scope 3 Avoidance Tracker</text>
    <text x="125" y="248" font-family="'Times New Roman', serif" font-size="8.5" fill="#1E7E34" text-anchor="middle">Delta: 2.47 kg CO2e / interaction</text>
    <text x="125" y="260" font-family="'Times New Roman', serif" font-size="8.5" fill="#333333" text-anchor="middle">Auto-dispatches Telkomsel Eco-Poin</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 495 160 L 525 160" stroke="#E4002B" stroke-width="3" stroke-dasharray="4,2"/>

  <!-- Layer 3: Security & Verification -->
  <g transform="translate(530, 20)">
    <rect width="160" height="280" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="36" rx="6" fill="url(#headerGrad)"/>
    <text x="80" y="23" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Security & Trust</text>

    <rect x="12" y="55" width="136" height="60" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="80" y="77" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">Dukcapil e-KYC</text>
    <text x="80" y="93" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">National ID &amp; Biometrics</text>
    <text x="80" y="105" font-family="'Times New Roman', serif" font-size="8" fill="#28A745" text-anchor="middle">Instant Liveness Match</text>

    <rect x="12" y="125" width="136" height="65" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="80" y="147" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">Telco Fraud Shield</text>
    <text x="80" y="163" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">Device-SIM Binding</text>
    <text x="80" y="175" font-family="'Times New Roman', serif" font-size="8" fill="#E4002B" text-anchor="middle">Anti-SIM Swap Hijack</text>

    <rect x="12" y="200" width="136" height="68" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
    <text x="80" y="222" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#B45309" text-anchor="middle">Human Escalation</text>
    <text x="80" y="238" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">Human-in-the-Loop</text>
    <text x="80" y="250" font-family="'Times New Roman', serif" font-size="8" fill="#555555" text-anchor="middle">Fallback &lt; 30 sec SLA</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 695 160 L 715 160" stroke="#E4002B" stroke-width="3" stroke-dasharray="4,2"/>

  <!-- Layer 4: Telkomsel Core Backend -->
  <g transform="translate(720, 20)">
    <rect width="160" height="280" rx="6" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="36" rx="6" fill="url(#headerGrad)"/>
    <text x="80" y="23" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. Telco Backend</text>

    <rect x="12" y="55" width="136" height="48" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="80" y="75" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">Core BSS / OSS</text>
    <text x="80" y="91" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">Provisioning &amp; Billing</text>

    <rect x="12" y="113" width="136" height="48" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="80" y="133" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">eSIM Profile SM-DP+</text>
    <text x="80" y="149" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">OTA Profile Delivery</text>

    <rect x="12" y="171" width="136" height="48" rx="4" fill="#FFFFFF" stroke="#002B66" stroke-width="1.2"/>
    <text x="80" y="191" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#002B66" text-anchor="middle">FMC &amp; IndiHome CRM</text>
    <text x="80" y="207" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">Unified User Profile</text>

    <rect x="12" y="229" width="136" height="45" rx="4" fill="#FFFFFF" stroke="#28A745" stroke-width="1.2"/>
    <text x="80" y="247" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#1E7E34" text-anchor="middle">ESG Registry</text>
    <text x="80" y="261" font-family="'Times New Roman', serif" font-size="8.5" fill="#555555" text-anchor="middle">Scope 3 Audit Trail</text>
  </g>
</svg>
